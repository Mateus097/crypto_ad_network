services:
  - type: web
    name: crypto-ad-network-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: crypto-ad-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true

databases:
  - name: crypto-ad-db
    databaseName: crypto_ad_db
    user: postgres